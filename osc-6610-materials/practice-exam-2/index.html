<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OSC 6610 Practice Exam 2</title><style>
:root{--ink:#203641;--muted:#596b75;--line:#d7dfe1;--teal:#17665b}*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #b17b16;outline-offset:4px}[hidden]{display:none!important}main{max-width:980px;margin:auto;padding:8px 24px 45px}.question{background:white;border:1px solid var(--line);border-radius:10px;padding:23px 26px;margin:18px 0}.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.q-num{font-size:12px;letter-spacing:.035em;text-transform:uppercase;font-weight:750;color:var(--teal)}.explain{padding:7px 11px;background:#f0f6f4;color:#175b50;border:1px solid #aac8bf;border-radius:6px;font-weight:700;font-size:12px;white-space:nowrap}.explain:hover{background:#e1eee8}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-size:16px;font-weight:600;padding:0;margin-bottom:14px;width:100%}.options{display:grid;gap:8px}.option{display:flex;gap:10px;align-items:baseline;padding:11px 13px;border:1px solid #dce4e6;border-radius:7px;font-size:15px;line-height:1.5;cursor:pointer}.option:hover{background:#f7faf9;border-color:#799b94}.option input{width:17px;height:17px;flex:0 0 auto;align-self:flex-start;margin:3px 0 0;accent-color:var(--teal)}.letter{font-size:12px;font-weight:750;color:#617582}.option.correct{background:#eef9f1;border-color:#6eaa83}.option.incorrect{background:#fff2f3;border-color:#d68a91}.feedback{font-size:14px;font-weight:650;margin-top:12px}.feedback:empty{display:none}.feedback.right{color:#176441}.feedback.wrong{color:#a12532}.solution{font-size:14px;background:#f3f6f8;border-left:3px solid #6e8c9c;border-radius:0 6px 6px 0;padding:13px 16px;margin-top:13px}.solution strong{display:block;margin-bottom:4px}.equations{display:flex;flex-wrap:wrap;gap:8px 24px;padding:11px 14px;background:#f4f6f6;border-radius:6px;margin:0 0 15px}.equations span{white-space:nowrap}.case{margin:28px 0 18px;background:#eaf1ef;border:1px solid #cadbd6;border-radius:10px;padding:23px 26px}.case h2{font-size:16px;margin:0 0 12px}.case p{font-size:15px;margin:10px 0}.table-wrap{overflow-x:auto;background:white;border-radius:6px;margin:12px 0 16px}table{width:100%;border-collapse:collapse;font-size:14px}caption{text-align:left;padding:8px 12px;background:#dfeae6;font-weight:650}th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid #dce4e2}thead th{font-size:13px;background:#f4f7f5}tbody tr:last-child>*{border-bottom:none}.variables{font-size:14px;display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;background:#fff;padding:12px 15px;border-radius:6px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}sub{font-size:.8em} @media(max-width:650px){main{padding:4px 13px 30px}.question,.case{padding:18px 16px;margin:14px 0}.case{margin-top:24px}.q-top{gap:6px}.explain{font-size:11px;padding:7px 8px}.option{font-size:14px;padding:10px}.variables{grid-template-columns:1fr}th,td{padding:8px 10px;min-width:75px}} @media print{body{background:white;font-size:11pt}.explain,.feedback{display:none!important}main{max-width:none;padding:0}.question,.case{break-inside:avoid;border-radius:0;background:white}.option,.option.correct,.option.incorrect{background:white;border-color:#ccc}.table-wrap{overflow:visible}.option{padding:6px}input{appearance:none;border:1px solid #777;border-radius:50%;width:12px!important;height:12px!important}}
.exam-title{max-width:980px;margin:0 auto;padding:22px 24px 16px;font-size:25px;line-height:1.3;font-weight:650}@media(max-width:650px){.exam-title{padding:18px 14px 14px;font-size:22px}}@media print{.exam-title{padding:0 0 16px}}

.exam-intro{margin:0 0 20px;color:var(--muted);font-size:15px;max-width:760px}
.statements{padding-left:28px;margin:0 0 18px}.statements li+li{margin-top:10px}
.option>span:last-child{min-width:0;overflow-wrap:anywhere}
.option:has(input:checked){border-width:2px;padding:10px 12px}
@media(max-width:650px){.option:has(input:checked){padding:9px}.exam-intro{font-size:14px}}
@media print{.solution{display:none!important}.exam-intro{color:#333}.question,.case{box-shadow:none}}

.exam-note{font-size:13px;color:var(--muted);margin:-8px 0 22px;max-width:800px}



@media print{.exam-note{color:#333}}
</style></head><body><h1 class="exam-title">OSC 6610 Practice Exam 2</h1><main><p class="exam-intro">12 multiple-choice questions.</p><p class="exam-note">Each question is independent unless a shared setup is provided.</p><noscript>This practice exam needs JavaScript enabled to show questions and feedback.</noscript><div id="questions"></div></main><script>
'use strict';
const questions = [{"n": 1, "stem": "For a profit-maximization integer program, the LP relaxation has an optimal objective value of $8,240. A feasible integer plan with profit $7,950 has been found. Based only on these facts, which statement must be true?", "options": ["The integer program’s optimal profit equals $8,240.", "The integer program’s optimal profit equals $7,950.", "The integer program’s optimal profit is between $7,950 and $8,000, inclusive.", "The integer program’s optimal profit is between $7,950 and $8,240, inclusive."], "answer": 3, "explanation": "The feasible integer plan establishes that the best integer profit is at least $7950. The relaxation has a larger feasible region, so its maximum of $8240 is an upper bound on the integer optimum. Neither endpoint is established as the integer optimum by the information given.", "extra": ""}, {"n": 2, "stem": "A firm is considering three projects: P, Q, and R. If both projects P and Q are selected, project R must not be selected. Otherwise, project R may be selected or not selected.<br><br>Let x<sub>P</sub>, x<sub>Q</sub>, and x<sub>R</sub> be binary variables, equal to 1 if the corresponding project is selected and 0 otherwise.<br><br>Which constraint models exactly this requirement?", "options": ["x<sub>P</sub> + x<sub>Q</sub> − 1 ≤ x<sub>R</sub>", "x<sub>R</sub> ≤ x<sub>P</sub> + x<sub>Q</sub>", "x<sub>P</sub> + x<sub>Q</sub> ≤ 2x<sub>R</sub>", "x<sub>P</sub> + x<sub>Q</sub> + x<sub>R</sub> ≤ 2"], "answer": 3, "explanation": "The correct constraint is x(P) + x(Q) + x(R) ≤ 2. When both P and Q are selected, it becomes 2 + x(R) ≤ 2, forcing x(R) = 0. When at most one of P and Q is selected, either binary value of x(R) is allowed. Thus the constraint excludes only the combination in which all three projects are selected.", "extra": ""}, {"n": 3, "stem": "Which objective correctly represents CedarWorks’ total profit?", "options": ["Maximize 18A + 10B − 900D − 600C", "Maximize 48A + 28B − 900D − 600C", "Maximize 18A + 10B − 900A − 600B", "Maximize 30A + 18B − 900D − 600C"], "answer": 0, "explanation": "Each display stand contributes $48 − $30 = $18 before rental, and each storage crate contributes $28 − $18 = $10. Equipment costs are charged once through the corresponding binary rental variables. Thus profit is 18A + 10B − 900D − 600C.", "extra": ""}, {"n": 4, "stem": "Let M be a sufficiently large upper bound on crate production. Which constraint prevents crate production when its equipment is not rented, while allowing any production quantity permitted by the resource limits when the equipment is rented?", "options": ["B ≥ MC", "B ≤ MC", "B ≤ C", "B ≤ M(1 − C)"], "answer": 1, "explanation": "The correct constraint is B ≤ MC. When C = 0, it becomes B ≤ 0; since B is nonnegative, this forces B = 0. When C = 1, it allows B up to M, subject to the resource limits. The constraint B ≤ C would unnecessarily limit production to at most one crate.", "extra": ""}, {"n": 5, "stem": "CedarWorks plans to produce 100 display stands and 150 storage crates and rents both equipment types. This plan satisfies the resource limits. What total profit does it earn?", "options": ["$3,300", "$2,400", "$1,800", "$1,500"], "answer": 2, "explanation": "The contribution before rental is 100 × $18 + 150 × $10 = $3300. Both rental costs apply, so subtract $900 + $600 = $1500. Total profit is $1800. The plan uses 700 labor hours and all 900 units of wood.", "extra": ""}, {"n": 6, "stem": "For this question only, the retailer requires at least 8 products to be offered at one of the two highest prices ($70 or $55). Which constraint models exactly this requirement?", "options": ["S<sub>1,1</sub> + ⋯ + S<sub>30,1</sub> + S<sub>1,2</sub> + ⋯ + S<sub>30,2</sub> ≤ 8", "S<sub>1,3</sub> + ⋯ + S<sub>30,3</sub> + S<sub>1,4</sub> + ⋯ + S<sub>30,4</sub> ≥ 8", "S<sub>1,1</sub> + ⋯ + S<sub>30,1</sub> + S<sub>1,2</sub> + ⋯ + S<sub>30,2</sub> = 8", "S<sub>1,1</sub> + ⋯ + S<sub>30,1</sub> + S<sub>1,2</sub> + ⋯ + S<sub>30,2</sub> ≥ 8"], "answer": 3, "explanation": "Price indices 1 and 2 correspond to $70 and $55. Adding their selection variables across all products counts how many products receive either of those prices. Each product is counted at most once because it receives exactly one price. “At least 8” requires a ≥ 8 bound; equality would unnecessarily forbid more than 8.", "extra": ""}, {"n": 7, "stem": "Under the original model, product 7 has the demand estimates shown below. Which price maximizes its revenue?", "options": ["$55", "$70", "$40", "$25"], "answer": 0, "explanation": "Compute price × demand for each choice: $70 × 12 = $840; $55 × 16 = $880; $40 × 21 = $840; $25 × 30 = $750. The $55 price gives the highest revenue. The price with the greatest demand does not necessarily maximize revenue.", "extra": "<div class=\"table-wrap\"><table><caption>Demand estimates for product 7</caption><thead><tr><th scope=\"col\">Price</th><th scope=\"col\">Demand</th></tr></thead><tbody><tr><th scope=\"row\">$70</th><td>12 units</td></tr><tr><th scope=\"row\">$55</th><td>16 units</td></tr><tr><th scope=\"row\">$40</th><td>21 units</td></tr><tr><th scope=\"row\">$25</th><td>30 units</td></tr></tbody></table></div>"}, {"n": 8, "stem": "An integer program maximizes 3u + 2v subject to the constraints below. Its LP relaxation has optimal solution (u,v) = (2.6,2.0). An analyst rounds it to (3,2). Which assessment of the rounded point is correct?", "options": ["It violates only u ≤ 2.6.", "It violates only u + v ≤ 4.6.", "It violates both u ≤ 2.6 and u + v ≤ 4.6.", "It satisfies every constraint because u and v are now integers."], "answer": 2, "explanation": "At (3,2), u = 3 exceeds 2.6 and u + v = 5 exceeds 4.6. Integer values alone do not ensure feasibility. LP-relaxation solutions cannot generally be converted into valid integer solutions simply by rounding.", "extra": "<div class=\"equations\" aria-label=\"Integer-program constraints\"><span>u + v ≤ 4.6</span><span>u ≤ 2.6</span><span>v ≤ 3</span><span>u, v ≥ 0 and integer</span></div>"}, {"n": 9, "stem": "Which objective correctly represents the distributor’s total shipping cost?", "options": ["Maximize 4x<sub>NA</sub> + 7x<sub>NB</sub> + 6x<sub>SA</sub> + 3x<sub>SB</sub>", "Minimize 70(x<sub>NA</sub> + x<sub>NB</sub>) + 50(x<sub>SA</sub> + x<sub>SB</sub>)", "Minimize 4(x<sub>NA</sub> + x<sub>SA</sub>) + 3(x<sub>NB</sub> + x<sub>SB</sub>)", "Minimize 4x<sub>NA</sub> + 7x<sub>NB</sub> + 6x<sub>SA</sub> + 3x<sub>SB</sub>"], "answer": 3, "explanation": "Each shipment quantity is multiplied by its own route’s per-unit cost. Add all four route costs and minimize the total. The depot supplies are capacity limits, not cost coefficients.", "extra": ""}, {"n": 10, "stem": "Which shipment plan satisfies both depot supply limits and both exact clinic requirements? Each option lists (x<sub>NA</sub>, x<sub>NB</sub>, x<sub>SA</sub>, x<sub>SB</sub>).", "options": ["(60, 20, 0, 20)", "(40, 10, 20, 20)", "(50, 20, 10, 20)", "(40, 0, 20, 50)"], "answer": 2, "explanation": "The third plan sends 70 units from North and 30 from South, within the supplies of 70 and 50. Clinic A receives 50 + 10 = 60, and Clinic B receives 20 + 20 = 40. The first plan exceeds North’s supply, the second leaves B short, and the fourth exceeds South’s supply and overdelivers to B.", "extra": ""}, {"n": 11, "stem": "Start from the feasible plan (40, 20, 20, 20), in the order (x<sub>NA</sub>, x<sub>NB</sub>, x<sub>SA</sub>, x<sub>SB</sub>). Reroute 10 units from North → B to North → A, and 10 units from South → A to South → B. Depot shipment totals and clinic deliveries remain unchanged. How does total shipping cost change?", "options": ["It decreases by $30.", "It decreases by $60.", "It increases by $60.", "It stays unchanged."], "answer": 1, "explanation": "The rerouted units originally cost 10 × $7 + 10 × $6 = $130. Their new routes cost 10 × $4 + 10 × $3 = $70, a saving of $60. The plan changes to (50, 10, 10, 30). Each depot still sends the same total, and each clinic still receives the same total, so feasibility is preserved.", "extra": ""}, {"n": 12, "stem": "Let q be the nonnegative integer number of units produced on a machine, and let y be binary, equal to 1 if the machine is activated and 0 otherwise. If activated, the machine must produce at least 25 units and can produce at most 120 units. If it is not activated, production must be zero. Which option models all these requirements?", "options": ["0 ≤ q ≤ 120y", "25 ≤ q ≤ 120y", "25y ≤ q ≤ 120", "25y ≤ q ≤ 120y"], "answer": 3, "explanation": "When y = 0, 25y ≤ q ≤ 120y becomes 0 ≤ q ≤ 0, forcing q = 0. When y = 1, it becomes 25 ≤ q ≤ 120. The first option omits the minimum production quantity; the second rules out non-activation; the third allows positive production when y = 0.", "extra": ""}];
const cases = {"3": "<aside class=\"case\" aria-labelledby=\"production-title\"><h2 id=\"production-title\">Use this information for Questions 3–5.</h2>\n<p>CedarWorks produces display stands and storage crates. It wants to <strong>maximize profit</strong>: sales revenue minus variable production costs and equipment rental costs.</p><div class=\"table-wrap\"><table><caption>Production requirements, prices, and costs</caption><thead><tr><th scope=\"col\">Product</th><th scope=\"col\">Labor per unit</th><th scope=\"col\">Wood per unit</th><th scope=\"col\">Selling price per unit</th><th scope=\"col\">Variable cost per unit</th><th scope=\"col\">Equipment rental for the period</th></tr></thead><tbody><tr><th scope=\"row\">Display stands (A)</th><td>4 hours</td><td>3 units</td><td>$48</td><td>$30</td><td>$900</td></tr><tr><th scope=\"row\">Storage crates (B)</th><td>2 hours</td><td>4 units</td><td>$28</td><td>$18</td><td>$600</td></tr></tbody></table></div><p>Available resources are <strong>800 labor hours</strong> and <strong>900 units of wood</strong>. All production can be sold. To produce a product, the firm must rent its equipment; the rental cost is incurred once for the period.</p>\n<div class=\"variables\"><span><strong>A</strong> = number of display stands produced</span><span><strong>B</strong> = number of storage crates produced</span><span><strong>D</strong> = 1 if stand equipment is rented; 0 otherwise</span><span><strong>C</strong> = 1 if crate equipment is rented; 0 otherwise</span></div>\n<p>A and B are nonnegative integers. D and C are binary.</p></aside>", "6": "<aside class=\"case\" aria-labelledby=\"pricing-title\"><h2 id=\"pricing-title\">Use this information for Questions 6–7.</h2>\n<p>A retailer chooses exactly one markdown price for each of <strong>30 products</strong>. The four allowed prices are <strong>$70, $55, $40, and $25</strong>. The goal is to <strong>maximize total revenue</strong>.</p><div class=\"table-wrap\"><table><caption>Price-level indices</caption><thead><tr><th scope=\"col\">Price index j</th><th scope=\"col\">Price p<sub>j</sub></th></tr></thead><tbody><tr><th scope=\"row\">1</th><td>$70</td></tr><tr><th scope=\"row\">2</th><td>$55</td></tr><tr><th scope=\"row\">3</th><td>$40</td></tr><tr><th scope=\"row\">4</th><td>$25</td></tr></tbody></table></div><p>For each product i = 1, …, 30 and price index j = 1, 2, 3, 4, <strong>S<sub>i,j</sub> = 1</strong> if price p<sub>j</sub> is selected for product i, and <strong>0 otherwise</strong>. Demand D<sub>i,j</sub> is a known, nonnegative input, and the revenue contribution is p<sub>j</sub>D<sub>i,j</sub>S<sub>i,j</sub>.</p>\n<p>Each product’s demand depends only on its own price, and inventory is sufficient to meet demand. The original model has exactly-one-price constraints and binary restrictions, with no other constraints. It need not use every price level.</p>\n<p><strong>Changes introduced in one question do not carry over to other questions.</strong></p></aside>", "9": "<aside class=\"case\" aria-labelledby=\"shipping-title\"><h2 id=\"shipping-title\">Use this information for Questions 9–11.</h2>\n<p>A distributor ships supplies from its North and South depots to Clinics A and B. North has <strong>at most 70 units</strong> available, and South <strong>at most 50 units</strong>. Clinic A must receive <strong>exactly 60 units</strong>, and Clinic B <strong>exactly 40 units</strong>. Unused depot supply is allowed.</p><div class=\"table-wrap\"><table><caption>Shipping cost per unit</caption><thead><tr><th scope=\"col\">Depot</th><th scope=\"col\">To Clinic A</th><th scope=\"col\">To Clinic B</th></tr></thead><tbody><tr><th scope=\"row\">North</th><td>$4</td><td>$7</td></tr><tr><th scope=\"row\">South</th><td>$6</td><td>$3</td></tr></tbody></table></div><p>The goal is to <strong>minimize total shipping cost</strong>. All shipment quantities are nonnegative. Use these decision variables:</p>\n<div class=\"variables\"><span><strong>x<sub>NA</sub></strong> = North → Clinic A</span><span><strong>x<sub>NB</sub></strong> = North → Clinic B</span><span><strong>x<sub>SA</sub></strong> = South → Clinic A</span><span><strong>x<sub>SB</sub></strong> = South → Clinic B</span></div></aside>"};
const letter = index => String.fromCharCode(65 + index);
function renderQuestion(q) {
 if (cases[q.n]) document.getElementById('questions').insertAdjacentHTML('beforeend', cases[q.n]);
 const article = document.createElement('article'); article.className = 'question'; article.id = `q${q.n}`;
 article.setAttribute('aria-label', `Question ${q.n}`);
 article.innerHTML = `<div class="q-top"><span class="q-num">Question ${q.n}</span><button class="explain" type="button" aria-expanded="false" aria-controls="solution-${q.n}" aria-label="Explain solution for question ${q.n}">Explain solution</button></div><fieldset><legend>${q.stem}</legend>${q.extra || ''}<div class="options">${q.options.map((option,i) => `<label class="option"><input type="radio" name="question-${q.n}" value="${i}" aria-describedby="feedback-${q.n}"><span class="letter" aria-hidden="true">${letter(i)}.</span><span>${option}</span></label>`).join('')}</div></fieldset><div class="feedback" id="feedback-${q.n}" role="status" aria-live="polite" aria-atomic="true"></div><div class="solution" id="solution-${q.n}" hidden><strong>Correct answer: ${letter(q.answer)}</strong>${q.explanation}</div>`;
 article.querySelectorAll('input').forEach(input => input.addEventListener('change', () => {
  const choice = Number(input.value);
  article.querySelectorAll('.option').forEach(row => row.classList.remove('correct','incorrect'));
  const correct = choice === q.answer;
  input.closest('.option').classList.add(correct ? 'correct' : 'incorrect');
  const feedback = article.querySelector('.feedback'); feedback.className = `feedback ${correct ? 'right' : 'wrong'}`;
  feedback.textContent = correct ? 'Correct.' : 'Not quite. Try another option, or select “Explain solution.”';
 }));
 const button = article.querySelector('.explain');
 button.addEventListener('click', () => {
  const solution = article.querySelector('.solution'); const opening = solution.hidden;
  solution.hidden = !opening; button.setAttribute('aria-expanded', String(opening));
  button.textContent = opening ? 'Hide solution' : 'Explain solution';
  button.setAttribute('aria-label', `${opening ? 'Hide' : 'Explain'} solution for question ${q.n}`);
 });
 document.getElementById('questions').append(article);
}
questions.forEach(renderQuestion);
</script></body></html>
