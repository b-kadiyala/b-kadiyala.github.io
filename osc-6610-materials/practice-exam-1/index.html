<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OSC 6610 Practice Exam 1</title><style>
:root{--ink:#203641;--muted:#596b75;--line:#d7dfe1;--teal:#17665b}*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #b17b16;outline-offset:4px}[hidden]{display:none!important}main{max-width:980px;margin:auto;padding:8px 24px 45px}.question{background:white;border:1px solid var(--line);border-radius:10px;padding:23px 26px;margin:18px 0}.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.q-num{font-size:12px;letter-spacing:.035em;text-transform:uppercase;font-weight:750;color:var(--teal)}.explain{padding:7px 11px;background:#f0f6f4;color:#175b50;border:1px solid #aac8bf;border-radius:6px;font-weight:700;font-size:12px;white-space:nowrap}.explain:hover{background:#e1eee8}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-size:16px;font-weight:600;padding:0;margin-bottom:14px;width:100%}.options{display:grid;gap:8px}.option{display:flex;gap:10px;align-items:baseline;padding:11px 13px;border:1px solid #dce4e6;border-radius:7px;font-size:15px;line-height:1.5;cursor:pointer}.option:hover{background:#f7faf9;border-color:#799b94}.option input{width:17px;height:17px;flex:0 0 auto;align-self:flex-start;margin:3px 0 0;accent-color:var(--teal)}.letter{font-size:12px;font-weight:750;color:#617582}.option.correct{background:#eef9f1;border-color:#6eaa83}.option.incorrect{background:#fff2f3;border-color:#d68a91}.feedback{font-size:14px;font-weight:650;margin-top:12px}.feedback:empty{display:none}.feedback.right{color:#176441}.feedback.wrong{color:#a12532}.solution{font-size:14px;background:#f3f6f8;border-left:3px solid #6e8c9c;border-radius:0 6px 6px 0;padding:13px 16px;margin-top:13px}.solution strong{display:block;margin-bottom:4px}.equations{display:flex;flex-wrap:wrap;gap:8px 24px;padding:11px 14px;background:#f4f6f6;border-radius:6px;margin:0 0 15px}.equations span{white-space:nowrap}.case{margin:28px 0 18px;background:#eaf1ef;border:1px solid #cadbd6;border-radius:10px;padding:23px 26px}.case h2{font-size:16px;margin:0 0 12px}.case p{font-size:15px;margin:10px 0}.table-wrap{overflow-x:auto;background:white;border-radius:6px;margin:12px 0 16px}table{width:100%;border-collapse:collapse;font-size:14px}caption{text-align:left;padding:8px 12px;background:#dfeae6;font-weight:650}th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid #dce4e2}thead th{font-size:13px;background:#f4f7f5}tbody tr:last-child>*{border-bottom:none}.variables{font-size:14px;display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;background:#fff;padding:12px 15px;border-radius:6px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}sub{font-size:.8em} @media(max-width:650px){main{padding:4px 13px 30px}.question,.case{padding:18px 16px;margin:14px 0}.case{margin-top:24px}.q-top{gap:6px}.explain{font-size:11px;padding:7px 8px}.option{font-size:14px;padding:10px}.variables{grid-template-columns:1fr}th,td{padding:8px 10px;min-width:75px}} @media print{body{background:white;font-size:11pt}.explain,.feedback{display:none!important}main{max-width:none;padding:0}.question,.case{break-inside:avoid;border-radius:0;background:white}.option,.option.correct,.option.incorrect{background:white;border-color:#ccc}.table-wrap{overflow:visible}.option{padding:6px}input{appearance:none;border:1px solid #777;border-radius:50%;width:12px!important;height:12px!important}}
.exam-title{max-width:980px;margin:0 auto;padding:22px 24px 16px;font-size:25px;line-height:1.3;font-weight:650}@media(max-width:650px){.exam-title{padding:18px 14px 14px;font-size:22px}}@media print{.exam-title{padding:0 0 16px}}
</style></head><body><h1 class="exam-title">OSC 6610 Practice Exam 1</h1><main><noscript>This practice exam needs JavaScript enabled to show questions and feedback.</noscript><div id="questions"></div></main><script>
'use strict';
const questions = [{"n": 1, "stem": "A model has the constraints shown below. Which proposed additional constraint would eliminate at least one currently feasible solution?", "options": ["x + y ≤ 15", "x ≤ 10", "y ≤ 7", "2x + 2y ≤ 24"], "answer": 2, "explanation": "The point (x, y) = (0, 9) satisfies the original model but violates y ≤ 7. Each other proposed constraint is already implied by the original constraints.", "extra": "<div class=\"equations\"><span>x + y ≤ 12</span><span>x ≤ 8</span><span>y ≤ 9</span><span>x, y ≥ 0</span></div>"}, {"n": 2, "stem": "A profit-maximization model has a labor shadow price of $12 per hour and an allowable labor increase of 30 hours. The firm can buy a package of 20 extra labor hours for $180. This purchase cost is not included in the current objective. With all other data fixed, should it buy the package?", "options": ["Yes; the net improvement is $60.", "Yes; the net improvement is $240.", "No; the net loss is $180.", "No; extra labor cannot improve profit."], "answer": 0, "explanation": "The package is within the allowable range. Extra operating profit is 20 × $12 = $240; subtracting the $180 purchase price gives a $60 net gain.", "extra": ""}, {"n": 3, "stem": "The current unit-profit coefficient of a product is $50. Its sensitivity report gives an allowable coefficient range of $40 to $80, with all other coefficients fixed. What is the largest percentage decrease from $50 for which the current production plan is still guaranteed to be optimal?", "options": ["10%", "25%", "20%", "60%"], "answer": 2, "explanation": "The coefficient can fall by $50 − $40 = $10. Relative to the original $50, that is 10/50 = 20%. At the endpoint, the current plan remains optimal, although another plan may tie.", "extra": ""}, {"n": 4, "stem": "A model maximizes 6x + 9y, with profits measured in dollars, and reports an optimal profit of $120. An analyst rewrites the objective as 600x + 900y to express the same profits in cents, leaving every constraint unchanged. What happens?", "options": ["The optimal quantities of both products increase by a factor of 100.", "The feasible region becomes 100 times larger.", "The optimal numerical objective value stays the same.", "The set of optimal production plans stays the same, and the optimal numerical objective value is multiplied by 100."], "answer": 3, "explanation": "Multiplying the entire objective by the same positive number preserves the ranking of all feasible plans. Only the units and numerical objective value change.", "extra": ""}, {"n": 5, "stem": "A resource has a shadow price of $8 per unit and an allowable increase of 20 units. A manager claims that adding 30 units will increase optimal profit by exactly $240. What is the best assessment?", "options": ["The claim is not established by this report; the proposed increase exceeds the range over which the $8 shadow price is guaranteed to apply.", "The claim is correct because a shadow price applies to any increase.", "The claim is wrong because increasing a resource always lowers maximum profit.", "The claim is correct only if the resource currently has positive slack."], "answer": 0, "explanation": "The prediction 30 × $8 extends beyond the 20-unit allowable increase. The report alone does not establish the full gain; re-solve the model to evaluate the 30-unit change.", "extra": ""}, {"n": 6, "stem": "Which objective correctly represents the delivery company’s goal?", "options": ["Maximize 2x<sub>NA</sub> + 5x<sub>NB</sub> + 4x<sub>SA</sub> + 3x<sub>SB</sub>", "Minimize 80(x<sub>NA</sub> + x<sub>NB</sub>) + 70(x<sub>SA</sub> + x<sub>SB</sub>)", "Minimize 2x<sub>NA</sub> + 5x<sub>NB</sub> + 4x<sub>SA</sub> + 3x<sub>SB</sub>", "Minimize 2(x<sub>NA</sub> + x<sub>SA</sub>) + 3(x<sub>NB</sub> + x<sub>SB</sub>)"], "answer": 2, "explanation": "Multiply the volume on each route by that route’s cost per liter, then minimize the total: 2x_NA + 5x_NB + 4x_SA + 3x_SB.", "extra": ""}, {"n": 7, "stem": "Which constraint correctly limits shipments from the North warehouse?", "options": ["x<sub>NA</sub> + x<sub>NB</sub> ≤ 80", "x<sub>NA</sub> + x<sub>SA</sub> ≤ 80", "x<sub>NA</sub> + x<sub>NB</sub> ≥ 80", "x<sub>NA</sub> ≤ 80 and x<sub>NB</sub> ≤ 80, with no limit on their sum"], "answer": 0, "explanation": "Both routes beginning at North draw from the same 80-liter supply. Their combined volume, x_NA + x_NB, must not exceed 80.", "extra": ""}, {"n": 8, "stem": "Which constraint ensures that Clinic B receives exactly its required volume?", "options": ["x<sub>NA</sub> + x<sub>NB</sub> = 50", "x<sub>NB</sub> + x<sub>SB</sub> ≤ 50", "x<sub>NB</sub> + x<sub>SB</sub> ≥ 50", "x<sub>NB</sub> + x<sub>SB</sub> = 50"], "answer": 3, "explanation": "Clinic B receives shipments from North and South. Their sum must equal 50; ≤ allows a shortage, while ≥ allows overdelivery.", "extra": ""}, {"n": 9, "stem": "An analyst writes x<sub>SA</sub> + x<sub>SB</sub> = 70 to represent South’s available supply. Why should the equality be replaced with ≤?", "options": ["The company must ship at least 70 liters from South.", "South can ship up to 70 liters, but it is allowed to leave some supply unused.", "An equality is never allowed in a linear program.", "South’s two routes must each carry exactly 70 liters."], "answer": 1, "explanation": "The 70 liters are available capacity, not a required shipment. An equality would unnecessarily force all of South’s supply to be used.", "extra": ""}, {"n": 10, "stem": "Which constraint correctly implements the requirement that at least half of Clinic A’s delivery comes from North?", "options": ["x<sub>NA</sub> ≥ 0.5x<sub>SA</sub>", "x<sub>NA</sub> ≤ x<sub>SA</sub>", "x<sub>NA</sub> ≥ x<sub>SA</sub>", "x<sub>NA</sub> + x<sub>NB</sub> ≥ x<sub>SA</sub> + x<sub>SB</sub>"], "answer": 2, "explanation": "The requirement is x_NA ≥ 0.5(x_NA + x_SA). Simplifying gives x_NA ≥ x_SA: North must send at least as much to A as South does.", "extra": ""}, {"n": 11, "stem": "Which proposed shipment plan satisfies all requirements? Each option lists (x<sub>NA</sub>, x<sub>NB</sub>, x<sub>SA</sub>, x<sub>SB</sub>) in liters.", "options": ["(30, 20, 30, 30)", "(20, 20, 40, 30)", "(30, 30, 30, 30)", "(70, 10, −10, 40)"], "answer": 0, "explanation": "The first plan ships 50 from North and 60 from South, delivers 60 to A and 50 to B, and gives A half its volume from North. The other plans violate A’s sourcing rule, B’s exact demand, or nonnegativity.", "extra": ""}];
const letter = index => String.fromCharCode(65 + index);
function renderQuestion(q) {
 if(q.n === 6) document.getElementById('questions').insertAdjacentHTML('beforeend', "<aside class=\"case\" aria-labelledby=\"case-title\"><h2 id=\"case-title\">Use this information for Questions 6–11.</h2><p>A delivery company ships a medical liquid from its North and South warehouses to Clinics A and B. It wants to <strong>minimize total shipping cost</strong>. Costs per liter and available supply are shown below.</p><div class=\"table-wrap\"><table><caption>Shipping costs and supply</caption><thead><tr><th scope=\"col\">Warehouse</th><th scope=\"col\">To Clinic A</th><th scope=\"col\">To Clinic B</th><th scope=\"col\">Available supply</th></tr></thead><tbody><tr><th scope=\"row\">North</th><td>$2 per liter</td><td>$5 per liter</td><td>80 liters</td></tr><tr><th scope=\"row\">South</th><td>$4 per liter</td><td>$3 per liter</td><td>70 liters</td></tr></tbody></table></div><p>Clinic A must receive <strong>exactly 60 liters</strong> and Clinic B <strong>exactly 50 liters</strong>. At least half of Clinic A’s delivery must come from North. Warehouse supply may be left unused. Shipments must be nonnegative, and fractional liters are allowed.</p><p>Use these decision variables, measured in liters shipped:</p><div class=\"variables\"><span><strong>x<sub>NA</sub></strong> = North → Clinic A</span><span><strong>x<sub>NB</sub></strong> = North → Clinic B</span><span><strong>x<sub>SA</sub></strong> = South → Clinic A</span><span><strong>x<sub>SB</sub></strong> = South → Clinic B</span></div></aside>");
 const article = document.createElement('article'); article.className = 'question'; article.id = `q${q.n}`;
 article.setAttribute('aria-label', `Question ${q.n}`);
 article.innerHTML = `<div class="q-top"><span class="q-num">Question ${q.n}</span><button class="explain" type="button" aria-expanded="false" aria-controls="solution-${q.n}" aria-label="Explain solution for question ${q.n}">Explain solution</button></div><fieldset><legend>${q.stem}</legend>${q.extra || ''}<div class="options">${q.options.map((option,i) => `<label class="option"><input type="radio" name="question-${q.n}" value="${i}" aria-describedby="feedback-${q.n}"><span class="letter" aria-hidden="true">${letter(i)}.</span><span>${option}</span></label>`).join('')}</div></fieldset><div class="feedback" id="feedback-${q.n}" role="status" aria-live="polite" aria-atomic="true"></div><div class="solution" id="solution-${q.n}" hidden><strong>Correct answer: ${letter(q.answer)}</strong>${q.explanation}</div>`;
 article.querySelectorAll('input').forEach(input => input.addEventListener('change', () => {
  const choice = Number(input.value);
  article.querySelectorAll('.option').forEach(row => row.classList.remove('correct','incorrect'));
  const correct = choice === q.answer;
  input.closest('.option').classList.add(correct ? 'correct' : 'incorrect');
  const feedback = article.querySelector('.feedback'); feedback.className = `feedback ${correct ? 'right' : 'wrong'}`;
  feedback.textContent = correct ? 'Correct.' : 'Not quite. Try another option, or select “Explain solution.”';
 }));
 const button = article.querySelector('.explain');
 button.addEventListener('click', () => {
  const solution = article.querySelector('.solution'); const opening = solution.hidden;
  solution.hidden = !opening; button.setAttribute('aria-expanded', String(opening));
  button.textContent = opening ? 'Hide solution' : 'Explain solution';
  button.setAttribute('aria-label', `${opening ? 'Hide' : 'Explain'} solution for question ${q.n}`);
 });
 document.getElementById('questions').append(article);
}
questions.forEach(renderQuestion);
</script></body></html>
