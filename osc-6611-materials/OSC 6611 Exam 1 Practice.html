const questions = [{"n": 1, "topic": "Newsvendor: comparative statics", "stem": "Which of the following statements are true?", "options": ["I only", "II only", "Both I and II", "Neither I nor II"], "answer": 0, "explanation": "<p>The critical fractile C<sub>u</sub> / (C<sub>u</sub> + C<sub>o</sub>) sets the order quantity: a higher fractile means a larger order.</p><p>I: a higher salvage value lowers C<sub>o</sub> = cost − salvage, so the fractile rises and the order quantity rises. True.</p><p>II: a higher purchase cost lowers C<sub>u</sub> = price − cost and raises C<sub>o</sub> = cost − salvage; the fractile falls, so the order quantity falls. False.</p>", "extra": "<ol class=\"statements\"><li>The optimal newsvendor order quantity increases as the salvage value of an unsold unit increases.</li><li>The optimal newsvendor order quantity increases as the purchase cost per unit increases (price and salvage value unchanged).</li></ol>"}, {"n": 2, "topic": "Newsvendor: normal demand, price-dependent mean", "stem": "Suppose the selling price is fixed at p = $30. What is the optimal order quantity?", "options": ["245", "255", "275", "285", "None of the above"], "answer": 1, "explanation": "<p>At p = $30: C<sub>u</sub> = 30 − 12 = $18 per lost sale; C<sub>o</sub> = 12 − 0 = $12 per unsold hoodie.</p><p>Critical fractile = C<sub>u</sub> / (C<sub>u</sub> + C<sub>o</sub>) = 18 / 30 = 0.60.</p><p>Demand is Normal with mean 400 − 5(30) = 250 and sd 20, so Q* = qnorm(0.6, 250, 20) ≈ 255 hoodies.</p><p>The 0.4 values use the overage share C<sub>o</sub> / (C<sub>u</sub> + C<sub>o</sub>) by mistake; the mean-280 values use the wrong mean.</p>", "extra": "<div class=\"equations\"><span class=\"hint-lab\">You may use:</span><span>qnorm(0.4, 250, 20) ≈ 245</span><span>qnorm(0.6, 250, 20) ≈ 255</span><span>qnorm(0.4, 280, 20) ≈ 275</span><span>qnorm(0.6, 280, 20) ≈ 285</span></div>"}, {"n": 3, "topic": "Newsvendor: service level and price", "stem": "Suppose the bookstore can set the price p. For what price p does the optimal order quantity achieve a service level of 80%?", "options": ["$15", "$24", "$48", "$60", "$96"], "answer": 3, "explanation": "<p>The service level of the optimal order is the critical fractile: P(D ≤ Q*) = C<sub>u</sub> / (C<sub>u</sub> + C<sub>o</sub>) = (p − 12) / p.</p><p>Set (p − 12) / p = 0.80: p − 12 = 0.8p, so 0.2p = 12 and p = $60.</p><p>The demand mean and standard deviation play no role: the fractile depends only on the cost ratio.</p>", "extra": ""}, {"n": 4, "topic": "Revenue management: protection level", "stem": "How many rooms should Summit Lodge protect for business guests to maximize expected revenue?", "options": ["32", "33", "34", "35", "36"], "answer": 3, "explanation": "<p>Protecting one room too few: a business guest paying $320 is turned away, but the room earned $80 from a leisure guest, so C<sub>u</sub> = 320 − 80 = $240.</p><p>Protecting one room too many: the room stays empty and the $80 leisure sale is lost, so C<sub>o</sub> = $80.</p><p>Critical fractile = 240 / (240 + 80) = 0.75.</p><p>Cumulative probabilities: P(D ≤ 30) = 0.05, P(D ≤ 31) = 0.15, P(D ≤ 32) = 0.30, P(D ≤ 33) = 0.50, P(D ≤ 34) = 0.68, P(D ≤ 35) = 0.82, P(D ≤ 36) = 0.92, P(D ≤ 37) = 1.00.</p><p>The smallest protection level whose cumulative probability reaches 0.75 is 35 rooms (P(D ≤ 34) = 0.68 is too low; P(D ≤ 35) = 0.82).</p>", "extra": ""}, {"n": 5, "topic": "Revenue management: stock-out probability", "stem": "Suppose Summit Lodge protects 33 rooms for business guests. What is the probability that a business guest is turned away because no room is available?", "options": ["18%", "32%", "50%", "68%", "82%"], "answer": 2, "explanation": "<p>A business guest is turned away when business demand exceeds the 33 protected rooms: P(D &gt; 33) = 1 − P(D ≤ 33).</p><p>P(D ≤ 33) = 0.05 + 0.10 + 0.15 + 0.20 = 0.50, so the probability of turning a guest away is 1 − 0.50 = 50%.</p>", "extra": ""}, {"n": 6, "topic": "Overbooking: optimal reservations", "stem": "What is the optimal number of reservations the airline should accept (rounded to the nearest integer) to maximize expected profit?", "options": ["195", "197", "200", "205", "None of the above"], "answer": 1, "explanation": "<p>The random quantity is the number of no-shows N; the decision is X, the number of seats overbooked (reservations = 180 + X).</p><p>One overbooking too few: a seat flies empty and its $300 fare is lost, so C<sub>u</sub> = $300.</p><p>One too many: a passenger is bumped. The airline collected $300 and pays $900, which already includes the refund, so the net cost is C<sub>o</sub> = 900 − 300 = $600.</p><p>Critical fractile = 300 / (300 + 600) = 0.33, so X* = qnorm(0.33, 20, 8) ≈ 17 and the airline accepts 180 + 17 = 197 reservations.</p><p>Using C<sub>o</sub> = $900 without netting out the fare gives the fractile 0.25 and 195, which is the classic mistake.</p>", "extra": "<div class=\"equations\"><span class=\"hint-lab\">You may use:</span><span>qnorm(0.25, 20, 8) ≈ 15</span><span>qnorm(0.33, 20, 8) ≈ 17</span><span>qnorm(0.50, 20, 8) = 20</span><span>qnorm(0.75, 20, 8) ≈ 25</span></div>"}, {"n": 7, "topic": "Overbooking: probability of enough seats", "stem": "Suppose the airline accepts 195 reservations. What is the probability that there are enough seats for every passenger who shows up?", "options": ["27%", "40%", "60%", "73%", "84%"], "answer": 3, "explanation": "<p>With 195 reservations the flight is overbooked by 195 − 180 = 15 seats. Everyone is seated if at least 15 passengers fail to show.</p><p>P(N ≥ 15) = 1 − P(N ≤ 15) = 1 − pnorm(15, 20, 8) = 1 − 0.27 = 0.73, about 73%.</p><p>27% is the probability that someone is bumped, the complement.</p>", "extra": "<div class=\"equations\"><span class=\"hint-lab\">You may use:</span><span>pnorm(12, 20, 8) ≈ 0.16</span><span>pnorm(15, 20, 8) ≈ 0.27</span><span>pnorm(18, 20, 8) ≈ 0.40</span><span>pnorm(22, 20, 8) ≈ 0.60</span></div>"}, {"n": 8, "topic": "Payoff table: expected value", "stem": "The bakery must choose before demand is realized. Which action maximizes expected net profit?", "options": ["Build a large line", "Build a small line", "Do not expand", "All actions give the same expected net profit", "No action maximizes expected net profit"], "answer": 0, "explanation": "<p>Expected net profit of each action ($ thousands):</p><p>Small line: 0.3(150) + 0.7(250) = 220.</p><p>Large line: 0.3(−50) + 0.7(500) = 335.</p><p>Do not expand: 100 in either state.</p><p>The large line has the highest expected net profit, even though it loses money if demand is weak.</p>", "extra": ""}, {"n": 9, "topic": "Payoff table: optimal expected value", "stem": "What is the bakery's maximum expected net profit (the expected net profit of the optimal action)?", "options": ["$100,000", "$220,000", "$300,000", "$335,000", "$400,000"], "answer": 3, "explanation": "<p>The optimal action is the large line: 0.3(−50) + 0.7(500) = −15 + 350 = 335, that is $335,000.</p><p>$220,000 is the small line's expected profit; $300,000 is the large line's profit averaged without probabilities.</p>", "extra": ""}, {"n": 10, "topic": "Decision tree: reading a branch", "stem": "Suppose BlueWave opens a Medium café. What is the probability that BlueWave makes a (strictly positive) profit?", "options": ["25%", "35%", "40%", "60%", "None of the above"], "answer": 3, "explanation": "<p>The Medium café earns $16K if demand is High, $6K if Moderate and loses $8K if Low.</p><p>It makes a profit in the High and Moderate states: 0.25 + 0.35 = 0.60, so 60%.</p><p>This question needs no expected values, just the probabilities of the favourable states.</p>", "extra": ""}, {"n": 11, "topic": "Decision tree: expected value of one alternative", "stem": "What is the expected profit of building a Large café (in $ thousands)?", "options": ["0.8", "1.4", "2.9", "4.15", "5.0"], "answer": 1, "explanation": "<p>Large café: 0.25(24) + 0.35(4) + 0.40(−15) = 6 + 1.4 − 6 = 1.4, that is $1.4K.</p><p>2.9 and 4.15 are the Medium and Small cafés' expected profits.</p>", "extra": ""}, {"n": 12, "topic": "Decision tree: optimal expected value", "stem": "What is BlueWave's expected profit under the optimal choice (in $ thousands)?", "options": ["0", "1.4", "2.9", "4.15", "8.45"], "answer": 3, "explanation": "<p>Expected profit of each option ($K): Do nothing 0; Small 0.25(10) + 0.35(7) + 0.40(−2) = 4.15; Medium 0.25(16) + 0.35(6) + 0.40(−8) = 2.90; Large 1.40.</p><p>The best is the Small café with expected profit $4.15K.</p><p>8.45 is the expected profit with perfect information, not the optimal expected profit.</p>", "extra": ""}, {"n": 13, "topic": "Expected value of perfect information", "stem": "What is the expected value of perfect information for BlueWave (in $ thousands)?", "options": ["2.9", "4.15", "4.3", "8.45", "12.6"], "answer": 2, "explanation": "<p>With perfect information BlueWave picks the best option for each demand level: High → Large ($24K); Moderate → Small ($7K); Low → Do nothing ($0).</p><p>Expected profit with perfect information = 0.25(24) + 0.35(7) + 0.40(0) = 8.45.</p><p>EVPI = 8.45 − 4.15 = 4.3, that is $4.3K: the most BlueWave should pay for a perfect demand forecast.</p>", "extra": ""}, {"n": 14, "topic": "Two-stage decision tree: optimal first decision", "stem": "Which decision maximizes the owner's expected profit at the first decision stage?", "options": ["Hire one barista", "Hire two baristas", "Outsource", "Overtime"], "answer": 1, "explanation": "<p>Roll back from the right. At the second-stage decision node (one barista, high demand) the owner picks the best of $3,800, $5,500 and $4,900: overtime, worth $5,500.</p><p>Hire one barista: 0.7(5,500) + 0.3(4,200) = 3,850 + 1,260 = $5,110.</p><p>Hire two baristas: 0.7(6,800) + 0.3(2,900) = 4,760 + 870 = $5,630.</p><p>Outsource: $4,500 for sure. The highest expected profit is hiring two baristas.</p><p>Overtime is a second-stage option, not a first-stage decision.</p>", "extra": ""}, {"n": 15, "topic": "Two-stage decision tree: optimal expected value", "stem": "What is the expected profit of the optimal alternative found in Question 14?", "options": ["$4,500", "$5,110", "$5,500", "$5,630", "$6,800"], "answer": 3, "explanation": "<p>Hiring two baristas: 0.7(6,800) + 0.3(2,900) = $5,630.</p><p>$5,110 is the expected profit of hiring one barista (with overtime if demand is high); $6,800 is a single payoff, not an expected value.</p>", "extra": ""}, {"n": 16, "topic": "Newsvendor: discrete demand", "stem": "Based on the demand distribution, how many mugs should the coffee shop order to maximize expected profit? Unsold mugs are worthless to the shop.", "options": ["50", "100", "200", "400", "800"], "answer": 0, "explanation": "<p>C<sub>u</sub> = price − cost = 20 − 12 = $8; C<sub>o</sub> = cost − salvage = 12 − 0 = $12.</p><p>Critical fractile = 8 / (8 + 12) = 0.40.</p><p>Cumulative probabilities: P(D ≤ 50) = 0.50, P(D ≤ 100) = 0.75, P(D ≤ 200) = 0.87, P(D ≤ 400) = 0.95, P(D ≤ 800) = 0.99, P(D ≤ 1600) = 1.00.</p><p>The smallest order whose cumulative probability reaches 0.40 is 50 mugs: P(D ≤ 50) = 0.50 ≥ 0.40.</p><p>Overage is the more expensive mistake, so the shop orders at the bottom of the demand range.</p>", "extra": ""}, {"n": 17, "topic": "Newsvendor: returns contract", "stem": "The potter now offers a returns contract: any mug unsold at the end of the semester can be sold back for $11. How many mugs should the shop order under this contract?", "options": ["50", "100", "200", "400", "800"], "answer": 3, "explanation": "<p>C<sub>u</sub> is unchanged at $8. The buy-back is a salvage value, so C<sub>o</sub> = cost − buy-back = 12 − 11 = $1.</p><p>Critical fractile = 8 / (8 + 1) = 0.89.</p><p>Cumulative probabilities: P(D ≤ 100) = 0.75, P(D ≤ 200) = 0.87, P(D ≤ 400) = 0.95. The first to reach 0.89 is 400 mugs.</p><p>A cheap overage mistake pushes the order far up the demand distribution: the returns contract moves the order from 50 to 400 mugs.</p>", "extra": ""}];
const cases = {"2": "<aside class=\"case\" aria-labelledby=\"case-hoodies\"><h2 id=\"case-hoodies\">Questions 2–3: Campus bookstore hoodies</h2><p>The campus bookstore sells university hoodies before the start of the fall semester. It buys hoodies from its supplier at $12 each. From past seasons the manager has learned that demand depends on the selling price p: demand is Normally distributed with mean (400 − 5p) and standard deviation 20. For example, at a price of $30, demand is Normal with mean 400 − 5(30) = 250 and standard deviation 20. Unsold hoodies have no salvage value.</p></aside>", "4": "<aside class=\"case\" aria-labelledby=\"case-lodge\"><h2 id=\"case-lodge\">Questions 4–5: Summit Lodge</h2><p>Summit Lodge has 80 rooms available for any given night and two types of guests. Business guests book close to the stay date and pay the high rate of $320; leisure guests book far in advance and pay only the low rate of $80. There are always enough leisure guests to fill every room offered at the low rate. The number of business guests is uncertain, with the distribution below.</p><div class=\"table-wrap\"><table><caption>Business-guest demand</caption><thead><tr><th scope=\"col\">Business guests</th><th scope=\"col\">30</th><th scope=\"col\">31</th><th scope=\"col\">32</th><th scope=\"col\">33</th><th scope=\"col\">34</th><th scope=\"col\">35</th><th scope=\"col\">36</th><th scope=\"col\">37</th></tr></thead><tbody><tr><th scope=\"row\">Probability</th><td>0.05</td><td>0.10</td><td>0.15</td><td>0.20</td><td>0.18</td><td>0.14</td><td>0.10</td><td>0.08</td></tr></tbody></table></div></aside>", "6": "<aside class=\"case\" aria-labelledby=\"case-flight\"><h2 id=\"case-flight\">Questions 6–7: The Salt Lake City – Boston flight</h2><p>The Salt Lake City – Boston flight has 180 seats. The fare is $300, and the number of ticketed passengers who do not show up is Normally distributed with mean 20 and standard deviation 8. The airline overbooks the flight. It estimates that each involuntary denied boarding costs $900, which includes the full $300 refund, rebooking on another carrier and a goodwill voucher.</p></aside>", "8": "<aside class=\"case\" aria-labelledby=\"case-bakery\"><h2 id=\"case-bakery\">Questions 8–9: Lakeside Bakery</h2><p>Lakeside Bakery is deciding whether to add a small or a large production line, or not to expand. Demand for its new product line will be either weak or strong; the probability of strong demand is 0.7 and of weak demand 0.3. The bakery must choose before demand is known. Net profits (in $ thousands) are given below.</p><div class=\"table-wrap\"><table><caption>Net profit ($ thousands)</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Weak demand (0.3)</th><th scope=\"col\">Strong demand (0.7)</th></tr></thead><tbody><tr><th scope=\"row\">Build a small line</th><td>150</td><td>250</td></tr><tr><th scope=\"row\">Build a large line</th><td>−50</td><td>500</td></tr><tr><th scope=\"row\">Do not expand</th><td>100</td><td>100</td></tr></tbody></table></div></aside>", "10": "<aside class=\"case\" aria-labelledby=\"case-bluewave\"><h2 id=\"case-bluewave\">Questions 10–13: BlueWave Coffee Roasters</h2><p>BlueWave Coffee Roasters is considering opening a café in a busy downtown district. It has three options: (i) a small café with 20 seats, (ii) a medium café with 40 seats, or (iii) a large café with 70 seats. Doing nothing is also an option, with a profit of $0. Profit depends on neighborhood demand, which management believes will be High with probability 0.25, Moderate with probability 0.35, or Low with probability 0.40. Profits (in $ thousands) for each café size and demand level are below. For all questions, assume BlueWave maximizes expected profit. The decision tree (without payoffs and probabilities) may help.</p><div class=\"table-wrap\"><table><caption>Profit ($ thousands)</caption><thead><tr><th scope=\"col\">Option</th><th scope=\"col\">High (0.25)</th><th scope=\"col\">Moderate (0.35)</th><th scope=\"col\">Low (0.40)</th></tr></thead><tbody><tr><th scope=\"row\">Small café</th><td>10</td><td>7</td><td>−2</td></tr><tr><th scope=\"row\">Medium café</th><td>16</td><td>6</td><td>−8</td></tr><tr><th scope=\"row\">Large café</th><td>24</td><td>4</td><td>−15</td></tr><tr><th scope=\"row\">Do nothing</th><td>0</td><td>0</td><td>0</td></tr></tbody></table></div><div class=\"fig\"><svg class=\"tree\" role=\"img\" aria-label=\"Decision tree\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 720 403.2\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-11-17T13:03:09.128905</dc:date>\n    <dc:format>image/svg+xml</dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.8.4, https://matplotlib.org/</dc:title>\n     </cc:Agent>\n    </dc:creator>\n   </cc:Work>\n  </rdf:RDF>\n </metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}</style>\n </defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 403.2 \nL 720 403.2 \nL 720 0 \nL 0 0 \nL 0 403.2 \nz\n\" style=\"fill: none\"/>\n  </g>\n  <g id=\"axes_1\">\n   <g id=\"line2d_1\">\n    <path d=\"M 36.923077 181.723944 \nL 258.461538 39.752113 \n\" clip-path=\"url(#p24874ec9ed)\" style=\"fill: none; stroke: #4f4f4f; stroke-width: 1.6; stroke-linecap: round\"/>\n   </g>\n   <g id=\"line2d_2\">\n    <path d=\"M 36.923077 181.723944 \nL 258.461538 115.470423 \n\" clip-path=\"url(#p24874ec9ed)\" style=\"fill: none; stroke: #4f4f4f; stroke-width: 1.6; stroke-linecap: round\"/>\n   </g>\n   <g id=\"line2d_3\">\n    <path d=\"M 258.461538 115.470423 \nL 516.923077 77.611268 \n\" clip-path=\"url(#p24874ec9ed)\" style=\"fill: none; stroke: #4f4f4f; stroke-w re the semester. Demand during the semester has the distribution below.</p><div class=\"table-wrap\"><table><caption>Mug demand</caption><thead><tr><th scope=\"col\">Demand</th><th scope=\"col\">50</th><th scope=\"col\">100</th><th scope=\"col\">200</th><th scope=\"col\">400</th><th scope=\"col\">800</th><th scope=\"col\">1600</th></tr></thead><tbody><tr><th scope=\"row\">Probability</th><td>0.50</td><td>0.25</td><td>0.12</td><td>0.08</td><td>0.04</td><td>0.01</td></tr></tbody></table></div></aside>"};
const letter = i => String.fromCharCode(65 + i);
const root = document.getElementById('questions');
function render(q) {
  if (cases[q.n]) root.insertAdjacentHTML('beforeend', cases[q.n]);
  const opts = q.options.map((o, i) => `<label class="option"><input type="radio" name="q${q.n}" value="${i}"><span class="letter">${letter(i)}</span><span>${o}</span></label>`).join('');
  root.insertAdjacentHTML('beforeend', `<section class="question" id="q${q.n}" data-answer="${q.answer}">
    <div class="q-top"><span class="q-num">Question ${q.n}</span><button class="explain" aria-expanded="false" aria-controls="sol${q.n}">Show solution</button></div>
    <fieldset><legend>${q.stem}</legend>${q.extra}<div class="options">${opts}</div></fieldset>
    <div class="feedback" aria-live="polite"></div>
    <div class="solution" id="sol${q.n}" hidden><strong>Answer: ${letter(q.answer)}. ${q.options[q.answer]}</strong><span class="topic">${q.topic}</span>${q.explanation}</div></section>`);
}
questions.forEach(render);
function reveal(sec, on) {
  const sol = sec.querySelector('.solution'), btn = sec.querySelector('.explain');
  sol.hidden = !on; btn.setAttribute('aria-expanded', on); btn.textContent = on ? 'Hide solution' : 'Show solution';
  const ans = +sec.dataset.answer;
  sec.querySelectorAll('.option').forEach((o, i) => o.classList.toggle('correct', on && i === ans));
}
function grade(sec) {
  const ans = +sec.dataset.answer, picked = sec.querySelector('input:checked');
  const fb = sec.querySelector('.feedback');
  sec.querySelectorAll('.option').forEach((o, i) => { o.classList.toggle('correct', i === ans); o.classList.toggle('incorrect', picked && +picked.value === i && i !== ans); });
  if (!picked) { fb.textContent = 'Not answered. The correct answer is ' + letter(ans) + '.'; fb.className = 'feedback wrong'; return 0; }
  const ok = +picked.value === ans;
  fb.textContent = ok ? 'Correct.' : 'Not quite: the correct answer is ' + letter(ans) + '.'; fb.className = 'feedback ' + (ok ? 'right' : 'wrong');
  return ok ? 1 : 0;
}
root.addEventListener('click', e => {
  const btn = e.target.closest('.explain'); if (!btn) return;
  const sec = btn.closest('.question'); reveal(sec, sec.querySelector('.solution').hidden);
});
document.getElementById('btnCheck').addEventListener('click', () => {
  let pts = 0, total = 0;
  document.querySelectorAll('.question').forEach(sec => { total += 1; pts += grade(sec); });
  document.getElementById('score').innerHTML = `Score: <b>${pts} / ${total}</b>`;
});
document.getElementById('btnAll').addEventListener('click', () => {
  const anyHidden = [...document.querySelectorAll('.solution')].some(s => s.hidden);
  document.querySelectorAll('.question').forEach(sec => reveal(sec, anyHidden));
});
document.getElementById('btnReset').addEventListener('click', () => {
  document.querySelectorAll('input[type=radio]').forEach(i => i.checked = false);
  document.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'incorrect'));
  document.querySelectorAll('.feedback').forEach(f => { f.textContent = ''; f.className = 'feedback'; });
  document.querySelectorAll('.question').forEach(sec => reveal(sec, false));
  document.getElementById('score').textContent = '';
  window.scrollTo({top: 0, behavior: 'smooth'});
});
